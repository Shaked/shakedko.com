<header class="site-header" role="banner">
  <div class="wrapper">
    <div class="header-top">
      <a class="site-title" rel="author" href="{{ "/" | relative_url }}">{{ site.title | escape }}</a>

      <nav class="site-nav" aria-label="Primary navigation">
      <input type="checkbox" id="nav-trigger" class="nav-trigger" aria-label="Toggle navigation" />
      <label class="nav-toggle" for="nav-trigger">
        <span class="menu-icon">
          <svg aria-hidden="true" focusable="false" viewBox="0 0 18 15" width="18" height="15">
            <path d="M18,1.484c0,0.82-0.665,1.484-1.484,1.484H1.484C0.665,2.969,0,2.304,0,1.484l0,0C0,0.665,0.665,0,1.484,0 h15.032C17.335,0,18,0.665,18,1.484L18,1.484z M18,7.516C18,8.335,17.335,9,16.516,9H1.484C0.665,9,0,8.335,0,7.516l0,0 c0-0.82,0.665-1.484,1.484-1.484h15.032C17.335,6.031,18,6.696,18,7.516L18,7.516z M18,13.516C18,14.335,17.335,15,16.516,15H1.484 C0.665,15,0,14.335,0,13.516l0,0c0-0.82,0.665-1.483,1.484-1.483h15.032C17.335,12.031,18,12.695,18,13.516L18,13.516z"/>
          </svg>
        </span>
      </label>

      <div class="trigger">
        {% if page.lang == "he" %}
          <a class="page-link" href="{{ "/he/" | relative_url }}">עמוד הבית</a>
          <a class="page-link social-link" href="{{ site.x_profile }}" target="_blank" rel="noopener noreferrer" aria-label="X profile (opens in a new tab)">
            <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24"><path d="M18.9 2H22l-6.8 7.8L23.2 22h-6.3l-4.9-6.4L6.4 22H3.3l7.3-8.4L2.8 2h6.4l4.4 5.8L18.9 2Zm-1.1 18h1.7L8.2 3.9H6.4L17.8 20Z"/></svg>
          </a>
          <a class="page-link social-link" href="{{ site.linkedin_profile }}" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn profile (opens in a new tab)">
            <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24"><path d="M5.4 3.5A2.4 2.4 0 1 1 5.4 8a2.4 2.4 0 0 1 0-4.5ZM3.3 9.7h4.2V21H3.3V9.7ZM10.1 9.7h4v1.5h.1c.6-1.1 1.9-2.2 4-2.2 4.3 0 5.1 2.8 5.1 6.5V21H19v-4.8c0-1.2 0-3-1.8-3-1.9 0-2.2 1.4-2.2 2.9V21h-4.2V9.7Z"/></svg>
          </a>
          <a class="page-link" href="{{ "/" | relative_url }}">English</a>
          <a class="page-link" href="{{ "/he/archive/" | relative_url }}">ארכיון</a>
        {% else %}
          <a class="page-link" href="{{ "/" | relative_url }}">Home</a>
          <a class="page-link social-link" href="{{ site.x_profile }}" target="_blank" rel="noopener noreferrer" aria-label="X profile (opens in a new tab)">
            <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24"><path d="M18.9 2H22l-6.8 7.8L23.2 22h-6.3l-4.9-6.4L6.4 22H3.3l7.3-8.4L2.8 2h6.4l4.4 5.8L18.9 2Zm-1.1 18h1.7L8.2 3.9H6.4L17.8 20Z"/></svg>
          </a>
          <a class="page-link social-link" href="{{ site.linkedin_profile }}" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn profile (opens in a new tab)">
            <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24"><path d="M5.4 3.5A2.4 2.4 0 1 1 5.4 8a2.4 2.4 0 0 1 0-4.5ZM3.3 9.7h4.2V21H3.3V9.7ZM10.1 9.7h4v1.5h.1c.6-1.1 1.9-2.2 4-2.2 4.3 0 5.1 2.8 5.1 6.5V21H19v-4.8c0-1.2 0-3-1.8-3-1.9 0-2.2 1.4-2.2 2.9V21h-4.2V9.7Z"/></svg>
          </a>
          <a class="page-link" href="{{ "/he/" | relative_url }}">עברית</a>
          <a class="page-link" href="{{ "/archive/" | relative_url }}">Archive</a>
        {% endif %}
      </div>
    </nav>
    </div>

    <div class="header-quote">
      <blockquote class="site-quote">If an expert says it can't be done, get another expert.</blockquote>
      <cite class="quote-author">David Ben-Gurion</cite>
    </div>
  </div>
</header>
